<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 288" width="1200" height="288" role="img" aria-label="Kyle Kim, Product Engineer. Design, Build, Ship, Operate.">
  <defs>
    <linearGradient id="edgeL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="ruleL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="288" rx="18" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="1199" height="287" rx="17.5" fill="none" stroke="#E3E6EE"/>
  <rect x="0" y="24" width="3" height="240" fill="url(#edgeL)"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="72" y="118" font-size="56" font-weight="700" letter-spacing="-1.6" fill="#0A0E17">Kyle Kim</text>
    <text x="75" y="152" font-size="12.5" font-weight="600" letter-spacing="5.2" fill="#4F46E5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PRODUCT ENGINEER</text>
    <rect x="75" y="176" width="120" height="2" fill="url(#ruleL)"/>
    <text x="75" y="212" font-size="16.5" fill="#4A5468">Multi-tenant SaaS from schema to zero-downtime deploy — owned end to end.</text>
    <text x="75" y="238" font-size="13.5" fill="#8590A2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Seoul, KR &#183; Java &#183; Spring Boot &#183; React &#183; AWS</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g>
      <rect x="768" y="44" width="368" height="44" rx="9" fill="#F7F8FB" stroke="#E7EAF1"/>
      <rect x="788" y="60" width="12" height="12" rx="3" fill="#4F46E5" opacity="0.3"/>
      <text x="814" y="70" font-size="12" font-weight="600" letter-spacing="3" fill="#6E7889">DESIGN</text>
      <text x="1114" y="70" font-size="11" letter-spacing="1" fill="#A0A9B8" text-anchor="end">schema &#183; domain</text>
    </g>
    <g>
      <rect x="768" y="100" width="368" height="44" rx="9" fill="#F7F8FB" stroke="#E7EAF1"/>
      <rect x="788" y="116" width="12" height="12" rx="3" fill="#4F46E5" opacity="0.52"/>
      <text x="814" y="126" font-size="12" font-weight="600" letter-spacing="3" fill="#616B7C">BUILD</text>
      <text x="1114" y="126" font-size="11" letter-spacing="1" fill="#A0A9B8" text-anchor="end">api &#183; ui</text>
    </g>
    <g>
      <rect x="768" y="156" width="368" height="44" rx="9" fill="#F7F8FB" stroke="#E7EAF1"/>
      <rect x="788" y="172" width="12" height="12" rx="3" fill="#4F46E5" opacity="0.75"/>
      <text x="814" y="182" font-size="12" font-weight="600" letter-spacing="3" fill="#545E70">SHIP</text>
      <text x="1114" y="182" font-size="11" letter-spacing="1" fill="#A0A9B8" text-anchor="end">blue / green</text>
    </g>
    <g>
      <rect x="768" y="212" width="368" height="44" rx="9" fill="#EEF0FE" stroke="#D5D9F7"/>
      <rect x="788" y="228" width="12" height="12" rx="3" fill="#4F46E5"/>
      <text x="814" y="238" font-size="12" font-weight="600" letter-spacing="3" fill="#3A3F73">OPERATE</text>
      <text x="1114" y="238" font-size="11" letter-spacing="1" fill="#8D93B8" text-anchor="end">metrics &#183; on-call</text>
